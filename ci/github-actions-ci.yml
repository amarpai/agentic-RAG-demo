name: ci

on:
  push:
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: payrag build-index
      - run: pytest -q
      - run: payrag eval --agent offline
      - uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: reports/
