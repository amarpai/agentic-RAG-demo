[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payrag"
version = "0.1.0"
description = "Agentic RAG demo: a payments-industry research agent over a hybrid semantic vector store, with evals and a confusion matrix."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "anthropic>=1.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
payrag = "payrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
